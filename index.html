<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Blitz Session Feedback</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2 id="openModal">Blitz Session Feedback</h2>
    </header>

    <!-- Modal -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img src="Images/Alim.jpeg" alt="Feedback Bild">
    </div>
    <style>
        h2 {
            cursor: pointer;
            user-select: none;
        }

        /* Hintergrund */
        .modal {
            display: none;
            /* Modal ist anfangs geschlossen */
            position: fixed;
            z-index: 999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);

            justify-content: center;
            align-items: center;
        }

        /* Bild */
        .modal img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        /* Schließen */
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
        }
    </style>

    <script>
        const openBtn = document.getElementById("openModal");
        const modal = document.getElementById("imageModal");
        const closeBtn = document.querySelector(".close");

        openBtn.addEventListener("click", () => {
            modal.style.display = "flex";
        });

        closeBtn.addEventListener("click", () => {
            modal.style.display = "none";
        });

        modal.addEventListener("click", (e) => {
            if (e.target === modal) {
                modal.style.display = "none";
            }
        });
    </script>

    <main>
        <div class="widget">
            <h1>Beitreten als?</h1>

            <div class="buttons">
                <a href="Prof.html" class="btn">Prof</a>
                <a href="sessioncode.html" class="btn">Stud</a>
            </div>

        </div>
    </main>

    <footer class="pageFooter tiny muted">
        Prototyp © 2026 Blitz Session Feedback
    </footer>

</body>

</html>
