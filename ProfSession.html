<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blitz Session Feedback – Professor Session</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h2 id="openModal">Blitz Session Feedback</h2>
  </header>

  <div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <img src="Images/Numan.jpeg" alt="Feedback Bild">
  </div>
  <style>
    h2 {
      cursor: pointer;
      user-select: none;
    }


    .modal {
      display: none;
      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);

      justify-content: center;
      align-items: center;
    }


    .modal img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }


    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
    }
  </style>

  <script>
    const openBtn = document.getElementById("openModal");
    const modal = document.getElementById("imageModal");
    const closeBtn = document.querySelector(".close");

    openBtn.addEventListener("click", () => {
      modal.style.display = "flex";
    });

    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    });
  </script>

  <main class="wrap">
    <section class="card">
      <div class="sessionRow">
        <div class="sessionMeta">
          <div class="kicker">Modul</div>
          <div class="title" id="moduleName">—</div>
          <div class="sub" id="sessionName">—</div>

          <div class="prompt">
            <div class="kicker">Hinweis / Frage des Lehrenden</div>
            <p id="profPrompt">—</p>
          </div>
        </div>

        <div class="timerBox" aria-label="Restzeit">
          <div class="kicker">Restzeit</div>
          <div class="timer" id="timer">60:00</div>

          <div style="height:8px"></div>

          <div class="kicker">Session-Code</div>
          <div style="font-weight:800" id="codeBox">—</div>

          <div style="height:12px"></div>


          <button id="endBtn" class="btn primary" style="width:100%">Beenden</button>
        </div>
      </div>

      <div class="sessionFooter">
        <span class="badge open" id="statusBadge">OFFEN</span>
      </div>
    </section>

    <section class="card">
      <div class="cardHead">
        <h2>Fragen der Studierenden</h2>
        <div class="controls">
          <label class="srOnly" for="sortSelect">Sortieren</label>
          <select id="sortSelect" class="select">
            <option value="top">Meist gevotet</option>
            <option value="new">Neueste</option>
          </select>
        </div>
      </div>

      <div class="list" id="questionList" aria-live="polite"></div>
    </section>

    <footer class="pageFooter tiny muted">
      Prototyp © 2026 Blitz Session Feedback
    </footer>
  </main>

  <script src="professor.js"></script>
</body>

</html>
