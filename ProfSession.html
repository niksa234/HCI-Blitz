<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blitz Session Feedback – Professor Session</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">Blitz Session Feedback</div>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="sessionRow">
        <div class="sessionMeta">
          <div class="kicker">Modul</div>
          <div class="title" id="moduleName">—</div>
          <div class="sub" id="sessionName">—</div>

          <div class="prompt">
            <div class="kicker">Hinweis / Frage des Lehrenden</div>
            <p id="profPrompt">—</p>
          </div>
        </div>

        <div class="timerBox" aria-label="Restzeit">
          <div class="kicker">Restzeit</div>
          <div class="timer" id="timer">60:00</div>

          <div style="height:8px"></div>

          <div class="kicker">Session-Code</div>
          <div style="font-weight:800" id="codeBox">—</div>

          <div style="height:12px"></div>

          <!-- korrekt formatiert: wie primary buttons im student-schema -->
          <button id="endBtn" class="btn primary" style="width:100%">Beenden</button>
        </div>
      </div>

      <div class="sessionFooter">
        <span class="badge open" id="statusBadge">OFFEN</span>
      </div>
    </section>

    <section class="card">
      <div class="cardHead">
        <h2>Fragen der Studierenden</h2>
        <div class="controls">
          <label class="srOnly" for="sortSelect">Sortieren</label>
          <select id="sortSelect" class="select">
            <option value="top">Meist gevotet</option>
            <option value="new">Neueste</option>
          </select>
        </div>
      </div>

      <div class="list" id="questionList" aria-live="polite"></div>
    </section>

    <footer class="pageFooter tiny muted"></footer>
  </main>

  <script src="professor.js"></script>
</body>

</html>
