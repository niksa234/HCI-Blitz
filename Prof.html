<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blitz Session Feedback – Professor</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <h2 id="openModal">Blitz Session Feedback</h2>
  </header>


  <div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <img src="Images/Ajun.jpeg" alt="Feedback Bild">
  </div>
  <style>
    h2 {
      cursor: pointer;
      user-select: none;
    }


    .modal {
      display: none;

      position: fixed;
      z-index: 999;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);

      justify-content: center;
      align-items: center;
    }


    .modal img {
      max-width: 80%;
      max-height: 80%;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
    }


    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: white;
      cursor: pointer;
    }
  </style>

  <script>
    const openBtn = document.getElementById("openModal");
    const modal = document.getElementById("imageModal");
    const closeBtn = document.querySelector(".close");

    openBtn.addEventListener("click", () => {
      modal.style.display = "flex";
    });

    closeBtn.addEventListener("click", () => {
      modal.style.display = "none";
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
      }
    });
  </script>

  <main class="wrap">
    <section class="card">
      <div class="cardHead">
        <h2>Session starten</h2>
      </div>

      <div class="kicker">Modul</div>
      <input id="moduleInput" class="textarea" style="min-height:44px" maxlength="80" placeholder="Lorem Ipsum" />

      <div style="height:10px"></div>

      <div class="kicker">Thema / Session-Name</div>
      <input id="topicInput" class="textarea" style="min-height:44px" maxlength="80" placeholder="Lorem Ipsum" />

      <div style="height:10px"></div>

      <div class="kicker">Hinweis / Frage des Lehrenden</div>
      <textarea id="promptInput" class="textarea" rows="3" maxlength="220" placeholder="Lorem Ipsum"></textarea>

      <div style="height:10px"></div>

      <div class="kicker">Dauer</div>
      <div class="row" style="flex-wrap:wrap">
        <button type="button" class="btn" data-min="60">60 Min</button>
        <button type="button" class="btn" data-min="30">30 Min</button>
        <button type="button" class="btn" data-min="15">15 Min</button>
      </div>

      <div style="height:12px"></div>

      <div class="row" style="justify-content:space-between; flex-wrap:wrap">
        <button id="startBtn" class="btn primary">Session starten</button>
        <a class="btn" href="index.html"
          style="text-decoration:none; display:inline-flex; align-items:center;">Zurück</a>
      </div>

      <div id="errorBox" class="small" style="color:#b91c1c; margin-top:10px; display:none;">
        Bitte fülle Modul, Thema und Hinweis aus.
      </div>
    </section>
    <footer class="pageFooter tiny muted">
      Prototyp © 2026 Blitz Session Feedback
    </footer>
  </main>

  <script src="professor.js"></script>
</body>

</html>
