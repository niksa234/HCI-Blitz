<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blitz Session Feedback – Professor</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">Blitz Session Feedback</div>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="cardHead">
        <h2>Session starten</h2>
      </div>

      <div class="kicker">Modul</div>
      <input id="moduleInput" class="textarea" style="min-height:44px" maxlength="80" placeholder="Lorem Ipsum" />

      <div style="height:10px"></div>

      <div class="kicker">Thema / Session-Name</div>
      <input id="topicInput" class="textarea" style="min-height:44px" maxlength="80" placeholder="Lorem Ipsum" />

      <div style="height:10px"></div>

      <div class="kicker">Hinweis / Frage des Lehrenden</div>
      <textarea id="promptInput" class="textarea" rows="3" maxlength="220" placeholder="Lorem Ipsum"></textarea>

      <div style="height:10px"></div>

      <div class="kicker">Dauer</div>
      <div class="row" style="flex-wrap:wrap">
        <button type="button" class="btn" data-min="60">60 Min</button>
        <button type="button" class="btn" data-min="30">30 Min</button>
        <button type="button" class="btn" data-min="15">15 Min</button>
      </div>

      <div style="height:12px"></div>

      <div class="row" style="justify-content:space-between; flex-wrap:wrap">
        <button id="startBtn" class="btn primary">Session starten</button>
        <a class="btn" href="index.html"
          style="text-decoration:none; display:inline-flex; align-items:center;">Zurück</a>
      </div>

      <div id="errorBox" class="small" style="color:#b91c1c; margin-top:10px; display:none;">
        Bitte fülle Modul, Thema und Hinweis aus.
      </div>
    </section>
    <footer class="pageFooter tiny muted">
      Prototyp © 2026 Blitz Session Feedback
    </footer>
  </main>

  <script src="professor.js"></script>
</body>

</html>
